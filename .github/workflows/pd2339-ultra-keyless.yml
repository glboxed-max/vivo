name: PD2339 Ultra 3.x 免手输凭证适配版
on:
  workflow_dispatch:
  push:
    branches: [pd2339-ultra-keyless-ci]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SukiSU-Nova/SukiSU-Nova
          ref: d2ab325e1863c6abae1935d5f617a92fb1574983
          fetch-depth: 0
          persist-credentials: false
          path: ultra
      - uses: actions/checkout@v4
        with:
          repository: xianwan1314/APatch
          ref: e8e4651c16fb5075882a25813c8732285fdb3505
          fetch-depth: 0
          persist-credentials: false
          path: apatch
      - uses: actions/checkout@v4
        with:
          repository: bmax121/KernelPatch
          ref: 0.13.9
          fetch-depth: 1
          persist-credentials: false
          path: kp
      - uses: actions/checkout@v4
        with:
          repository: WildKernels/AnyKernel3
          ref: e1e9dce98430c5c6f231f7094a8c7f4ecaf50948
          persist-credentials: false
          path: ak3
      - name: 接入 Ultra 原始页面与自动配对后端
        run: |
          python3 .github/tools/apply_ultra_keyless.py ultra apatch
          python3 .github/tools/ultra_ui_modules.py ultra apatch
          git -C ultra diff --check
          sh -n .github/tools/ultra-paired-anykernel.sh
      - name: 准备内置修补工具和 AnyKernel3 模板
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p components output ultra/manager/app/src/main/assets/pairing ultra/manager/app/src/main/jniLibs/arm64-v8a
          gh release download 0.13.9 -R bmax121/KernelPatch -p kpimg-android -p kptools-android -D components
          echo 'eb2e3d16fe69410150efcf6f9425baf8cad9ac0c39f051fc8b40ce57c7143adb  components/kpimg-android' | sha256sum -c
          echo '63a8656a79b74baadcf0ce57a7e89a8c8a94beb35b25df58aec0bcf1d066bc5b  components/kptools-android' | sha256sum -c
          python3 .github/tools/prepare_ultra_manager_kpimg.py components/kpimg-android ultra/manager/app/src/main/assets/pairing/kpimg
          cp components/kptools-android ultra/manager/app/src/main/jniLibs/arm64-v8a/libkptools.so
          python3 .github/tools/verify_ultra_manager_mode.py ultra components/kpimg-android
          cp .github/tools/ultra-paired-anykernel.sh ak3/anykernel.sh
          cp .github/tools/ultra-keyless/使用说明.md ak3/
          cd ak3
          zip -qr ../output/Ultra-Paired-AnyKernel3-template.zip . -x '.git/*' '.github/*'
          cd ..
          cp output/Ultra-Paired-AnyKernel3-template.zip ultra/manager/app/src/main/assets/pairing/AnyKernel3-template.zip
      - name: 编译 vivo 反 SU KPM
        run: |
          curl -fL -o "$RUNNER_TEMP/toolchain.tar.xz" https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xJf "$RUNNER_TEMP/toolchain.tar.xz" -C "$RUNNER_TEMP"
          make -C .github/tools/kpm KP_DIR="$PWD/kp" TARGET_COMPILE="$RUNNER_TEMP/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-"
          readelf -S .github/tools/kpm/vr_module_blocker.kpm | grep -q '\.kpm\.init'
          readelf -s .github/tools/kpm/vr_module_blocker.kpm | grep -q 'kallsyms_lookup_name'
          allowed='^(kallsyms_lookup_name|hook_syscalln|unhook_syscalln|has_syscall_wrapper|printk|kf_memcmp|kf_memchr|kf_memcpy|kf_memmove|kf_memset|kf_strcmp|kf_strncmp|kf_strlen|kf_strnlen)$'
          bad=$(readelf -sW .github/tools/kpm/vr_module_blocker.kpm | awk '$7=="UND" && $8!="" {print $8}' | sort -u | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "unexpected undefined symbols:"; echo "$bad"; exit 1; fi
          cp .github/tools/kpm/vr_module_blocker.kpm ultra/manager/app/src/main/assets/pairing/vr_module_blocker.kpm
      - name: 准备 Magiskboot
        run: |
          curl -fL -o "$RUNNER_TEMP/magisk.apk" https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk
          unzip -p "$RUNNER_TEMP/magisk.apk" lib/arm64-v8a/libmagiskboot.so > ultra/manager/app/src/main/jniLibs/arm64-v8a/libmagiskboot.so
          test -s ultra/manager/app/src/main/jniLibs/arm64-v8a/libmagiskboot.so
          chmod 755 ultra/manager/app/src/main/jniLibs/arm64-v8a/libmagiskboot.so
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apatch/apd
          key: ultra-modules-ndk29-v1
          cache-on-failure: true
      - name: 编译独立用户态模块后端
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865' >/dev/null
          cargo install cargo-ndk --locked
          cd apatch/apd
          cargo ndk -t arm64-v8a build --release --locked
          cd ../..
          cp apatch/apd/target/aarch64-linux-android/release/apd ultra/manager/app/src/main/jniLibs/arm64-v8a/libapd.so
          gh run download 44482731236 -R glboxed-max/vivo -n PD2339-APatch-manager-debug -D components/apatch-runtime
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apk = next(Path('components/apatch-runtime').rglob('*.apk'))
          with zipfile.ZipFile(apk) as archive:
              busybox = archive.read('lib/arm64-v8a/libbusybox.so')
          digest = hashlib.sha256(busybox).hexdigest()
          assert digest == '4d60ab3f5a59ebb2ca863f2f514e6924401b581e9b64f602665c008177626651'
          native = Path('ultra/manager/app/src/main/jniLibs/arm64-v8a')
          (native / 'libbusybox.so').write_bytes(busybox)
          assets = Path('ultra/manager/app/src/main/assets/modules')
          assets.mkdir(parents=True, exist_ok=True)
          kpm = Path('ultra/manager/app/src/main/assets/pairing/vr_module_blocker.kpm')
          info = {
              'apdSha256': hashlib.sha256((native / 'libapd.so').read_bytes()).hexdigest(),
              'busyboxSha256': digest,
              'magiskbootSha256': hashlib.sha256((native / 'libmagiskboot.so').read_bytes()).hexdigest(),
              'kpmSha256': hashlib.sha256(kpm.read_bytes()).hexdigest(),
          }
          (assets / 'runtime-info.json').write_text(json.dumps(info), encoding='utf-8')
          PY
      - name: 校验 PD2339 适配内容
        run: python3 .github/tools/verify_pd2339_adaptation.py ultra .github/tools/ultra-paired-anykernel.sh
      - name: 准备稳定构建签名
        env:
          SIGNING_STORE: ${{ secrets.ULTRA_PD2339_KEYSTORE }}
        run: |
          test -n "$SIGNING_STORE"
          printf '%s' "$SIGNING_STORE" | base64 -d > "$RUNNER_TEMP/pd2339.p12"
          chmod 600 "$RUNNER_TEMP/pd2339.p12"
      - name: 编译 ARM64 APK
        working-directory: ultra/manager
        env:
          ULTRA_KEYSTORE_FILE: ${{ runner.temp }}/pd2339.p12
          ULTRA_KEYSTORE_PASSWORD: ${{ secrets.ULTRA_PD2339_STORE_PASSWORD }}
        run: bash gradlew --no-daemon assembleDebug
      - name: 检查签名和导出结果
        run: |
          cp ultra/manager/app/build/outputs/apk/debug/*.apk output/
          cp .github/tools/ultra-keyless/使用说明.md output/
          apk=$(find output -maxdepth 1 -name '*.apk' -print -quit)
          apksigner=$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" > output/APK-signature.txt
          unzip -tq "$apk"
          python3 - "$apk" <<'PY'
          import hashlib, json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              info = json.loads(apk.read('assets/modules/runtime-info.json'))
              for name in ('apd', 'busybox', 'magiskboot'):
                  assert hashlib.sha256(apk.read(f'lib/arm64-v8a/lib{name}.so')).hexdigest() == info[f'{name}Sha256'], f'Packaged {name} digest mismatch'
              assert hashlib.sha256(apk.read('assets/pairing/vr_module_blocker.kpm')).hexdigest() == info['kpmSha256'], 'Packaged KPM digest mismatch'
          print('Packaged runtime digests verified')
          PY
          unzip -tq output/Ultra-Paired-AnyKernel3-template.zip
          cd output
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PD2339-Ultra-Keyless-debug
          path: output/*
          if-no-files-found: error
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-keyless-tests
          path: |
            ultra/manager/app/build/reports/tests/
            ultra/manager/app/build/test-results/
          if-no-files-found: ignore
