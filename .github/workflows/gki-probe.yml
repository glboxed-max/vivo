name: PD2339 MT6989 Android 16 源码基线

on:
  workflow_dispatch:
  push:
    branches: [pd2339-vendor-source-ci-20261118]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: 安装 repo 工具 + 准备目录
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/git-repo" "$GITHUB_WORKSPACE/kernel" "$GITHUB_WORKSPACE/AnyKernel3"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: 同步 AOSP 内核源码（android14-6.1 / 2025-09 = 6.1.145）
        uses: ./.github/actions/download-kernel
        with:
          android_version: android14
          kernel_version: '6.1'
          version: android14-6.1
          os_patch_level: '2025-09'

      - name: 切换到 MT6989 Android 16 公开源码
        working-directory: ${{ github.workspace }}/kernel
        env:
          VENDOR_COMMIT: 416f41a95734d2c05bca293ac5d6b3187ad78f2e
        run: |
          set -euo pipefail
          git init vendor-common
          git -C vendor-common fetch --depth=1 https://github.com/winzkh/android_kernel_vivo_mt6989.git "$VENDOR_COMMIT"
          git -C vendor-common checkout --detach FETCH_HEAD
          test "$(git -C vendor-common rev-parse HEAD)" = "$VENDOR_COMMIT"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' vendor-common/Makefile
          grep -qx 'VERSION = 6' vendor-common/Makefile
          grep -qx 'PATCHLEVEL = 1' vendor-common/Makefile
          grep -qx 'SUBLEVEL = 145' vendor-common/Makefile
          mv common "$RUNNER_TEMP/aosp-common"
          mv vendor-common common

      - name: 诊断构建跳过缺失的 Vivo RSC
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          if [ ! -f kernel/vivo_rsc/Kconfig ]; then
            echo "::warning::Vivo RSC source absent. Diagnostic Image only. Vendor ABI is not restored."
            grep -Fx 'source "kernel/vivo_rsc/Kconfig"' Kconfig
            sed -i '/^source "kernel\/vivo_rsc\/Kconfig"$/d' Kconfig
          fi

      - name: 关掉 WERROR（-Warray-bounds 会误伤，且不影响 ABI）
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/kernel/common/arch/arm64/configs/gki_defconfig"
          sed -i 's/^CONFIG_WERROR=y/# CONFIG_WERROR is not set/' "$D"
          grep -q '^\(# \)\?CONFIG_WERROR' "$D" || echo '# CONFIG_WERROR is not set' >> "$D"
          grep -n 'CONFIG_WERROR' "$D"

      - name: 构建 Image（自动补齐 module_outs 并重试）
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -uo pipefail
          sed -i 's/check_defconfig//' ./common/build.config.gki
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          ok=0
          for i in 1 2 3 4; do
            echo "===== Bazel 构建 第 $i 次 ====="
            if tools/bazel build --verbose_failures --config=fast --notrim --disk_cache=/home/runner/.cache/bazel \
                 //common:kernel_aarch64/Image > /tmp/bazel.log 2>&1; then
              ok=1; break
            fi
            echo "----- 真实 error 行（最多 40 条）-----"
            grep -n -m 40 -E "error:|Error [0-9]|fatal error|BUILD_BUG_ON|No such file or directory|undeclared|note: expanded from macro|expected" /tmp/bazel.log || true
            echo "----- tail 40 -----"
            tail -40 /tmp/bazel.log || true
            python3 "$GITHUB_WORKSPACE/.github/tools/bazel_module_outs.py" /tmp/bazel.log common/BUILD.bazel || break
          done
          [ "$ok" = "1" ] || { echo "构建失败"; exit 1; }

      - name: 失败时上传 bazel 日志（供无 token 的协作者取用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-log
          path: /tmp/bazel.log
          if-no-files-found: ignore

      - name: 收集产物
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          IMG=""
          for c in bazel-bin/common/kernel_aarch64/Image common/bazel-bin/common/kernel_aarch64/Image; do
            [ -f "$c" ] && IMG="$c" && break
          done
          [ -n "$IMG" ] || { echo "找不到 Image"; find . -name Image -path '*kernel_aarch64*' | head; exit 1; }
          cp "$IMG" "$GITHUB_WORKSPACE/AnyKernel3/Image"
          ls -l "$GITHUB_WORKSPACE/AnyKernel3/Image"
          strings "$GITHUB_WORKSPACE/AnyKernel3/Image" | grep -m1 "SMP preempt mod_unload" || true

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: mt6989-a16-diagnostic-Image
          path: ${{ github.workspace }}/AnyKernel3/Image
          if-no-files-found: error
          compression-level: 0
