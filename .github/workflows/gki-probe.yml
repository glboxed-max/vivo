name: PD2339 Nova v3 配套管理器与 AnyKernel3

# 基于已验证的 6.1.145 GKI 构建，检查 Nova 内建接口与编译结果。

on:
  workflow_dispatch:
  push:
    branches: [pd2339-nova-paired-ci]

permissions:
  contents: read

jobs:
  manager:
    uses: ./.github/workflows/pd2339-nova-v3.yml
  probe:
    needs: manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: 安装 repo 工具 + 准备目录
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/git-repo" "$GITHUB_WORKSPACE/kernel" "$GITHUB_WORKSPACE/AnyKernel3"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: 同步 AOSP 内核源码（android14-6.1 / 2025-09 = 6.1.145）
        uses: ./.github/actions/download-kernel
        with:
          android_version: android14
          kernel_version: '6.1'
          version: android14-6.1
          os_patch_level: '2025-09'

      - name: 检出 Nova v3.0.0 源码
        uses: actions/checkout@v4
        with:
          repository: SukiSU-Nova/SukiSU-Nova
          ref: c60f21b9e00e35e898f8d21e0612465b76b9beec
          path: nova
          persist-credentials: false

      - name: 下载同次构建的管理器公开证书
        uses: actions/download-artifact@v4
        with:
          name: pd2339-nova-manager-certificate
          path: manager-certificate

      - name: 内建 Nova Root 与 KPM 桥接
        working-directory: kernel/common
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/nova" rev-parse HEAD)" = c60f21b9e00e35e898f8d21e0612465b76b9beec
          grep -qx 'SUBLEVEL = 145' Makefile
          test ! -e drivers/kernelsu
          # 保留上游 Kbuild 和接口，展开 UAPI 目录以便 Kleaf 收集文件。
          mkdir drivers/kernelsu
          cp -aL "$GITHUB_WORKSPACE/nova/kernel/." drivers/kernelsu/
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test "$(grep -Fxc 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig)" = 1
          scripts/config --file arch/arm64/configs/gki_defconfig -e KSU -e KPM -e KALLSYMS_ALL
          certificate="$GITHUB_WORKSPACE/manager-certificate/manager.der"
          cert_hash=$(sha256sum "$certificate" | cut -d' ' -f1)
          cert_size=$(wc -c < "$certificate")
          test "$cert_size" -gt 0 && test "$cert_size" -le 1024
          kbuild=drivers/kernelsu/Kbuild
          test "$(grep -Ec '^KSU_EXPECTED_SIZE +\?=' "$kbuild")" = 1
          test "$(grep -Ec '^KSU_EXPECTED_HASH +\?=' "$kbuild")" = 1
          sed -i -E "s/^KSU_EXPECTED_SIZE +\?=.*/KSU_EXPECTED_SIZE ?= $cert_size/; s/^KSU_EXPECTED_HASH +\?=.*/KSU_EXPECTED_HASH ?= $cert_hash/" "$kbuild"
          printf '%s\n' "$cert_hash" > "$GITHUB_WORKSPACE/AnyKernel3/manager-certificate.sha256"

      - name: 关掉 WERROR（-Warray-bounds 会误伤，且不影响 ABI）
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/kernel/common/arch/arm64/configs/gki_defconfig"
          sed -i 's/^CONFIG_WERROR=y/# CONFIG_WERROR is not set/' "$D"
          grep -q '^\(# \)\?CONFIG_WERROR' "$D" || echo '# CONFIG_WERROR is not set' >> "$D"
          grep -n 'CONFIG_WERROR' "$D"

      - name: 构建 Image（自动补齐 module_outs 并重试）
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -uo pipefail
          sed -i 's/check_defconfig//' ./common/build.config.gki
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          ok=0
          for i in 1 2 3 4; do
            echo "===== Bazel 构建 第 $i 次 ====="
            if tools/bazel build --config=fast --notrim --disk_cache=/home/runner/.cache/bazel \
                 //common:kernel_aarch64/Image //common:kernel_aarch64/vmlinux > /tmp/bazel.log 2>&1; then
              ok=1; break
            fi
            echo "----- 真实 error 行（最多 40 条）-----"
            grep -n -m 40 -E "error:|Error [0-9]|fatal error|BUILD_BUG_ON|No such file or directory|undeclared|note: expanded from macro|expected" /tmp/bazel.log || true
            echo "----- tail 40 -----"
            tail -40 /tmp/bazel.log || true
            python3 "$GITHUB_WORKSPACE/.github/tools/bazel_module_outs.py" /tmp/bazel.log common/BUILD.bazel || break
          done
          [ "$ok" = "1" ] || { echo "构建失败"; exit 1; }

      - name: 失败时上传 bazel 日志（供无 token 的协作者取用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-log
          path: /tmp/bazel.log
          if-no-files-found: ignore

      - name: 收集产物
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          IMG=""
          for c in bazel-bin/common/kernel_aarch64/Image common/bazel-bin/common/kernel_aarch64/Image; do
            [ -f "$c" ] && IMG="$c" && break
          done
          [ -n "$IMG" ] || { echo "找不到 Image"; find . -name Image -path '*kernel_aarch64*' | head; exit 1; }
          common/scripts/extract-ikconfig "$IMG" > "$GITHUB_WORKSPACE/AnyKernel3/effective.config"
          for option in CONFIG_KSU CONFIG_KPM CONFIG_KALLSYMS_ALL; do
            grep -Fx "$option=y" "$GITHUB_WORKSPACE/AnyKernel3/effective.config"
          done
          readelf --wide --symbols "$(dirname "$IMG")/vmlinux" > "$RUNNER_TEMP/nova-kernel-symbols"
          grep -E '[[:space:]]sukisu_kpm_bridge$' "$RUNNER_TEMP/nova-kernel-symbols"
          grep -E '[[:space:]]ksu_extension_kpm_io$' "$RUNNER_TEMP/nova-kernel-symbols"
          grep -E '[[:space:]]kernelsu_init$' "$RUNNER_TEMP/nova-kernel-symbols"
          cert_hash=$(cat "$GITHUB_WORKSPACE/AnyKernel3/manager-certificate.sha256")
          grep -aFq "$cert_hash" "$IMG"
          cp "$IMG" "$GITHUB_WORKSPACE/AnyKernel3/Image"

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: pd2339-nova-builtin-diagnostic
          path: |
            ${{ github.workspace }}/AnyKernel3/Image
            ${{ github.workspace }}/AnyKernel3/effective.config
          if-no-files-found: error
          compression-level: 0
      - name: 检出固定版本的 AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: WildKernels/AnyKernel3
          ref: e1e9dce98430c5c6f231f7094a8c7f4ecaf50948
          path: ak3
          persist-credentials: false
      - name: 打包 PD2339 专用验证包
        run: |
          set -euo pipefail
          install -m 0644 .github/tools/pd2339-anykernel.sh ak3/anykernel.sh
          install -m 0644 AnyKernel3/Image ak3/Image
          install -m 0644 AnyKernel3/manager-certificate.sha256 ak3/manager-certificate.sha256
          sh -n ak3/anykernel.sh
          test -f ak3/META-INF/com/google/android/update-binary
          test -f ak3/tools/ak3-core.sh
          cd ak3
          zip -qr "$RUNNER_TEMP/PD2339-Nova-v3-AnyKernel3-diagnostic.zip" . -x '.git*' '.github/*'
          unzip -tq "$RUNNER_TEMP/PD2339-Nova-v3-AnyKernel3-diagnostic.zip"
      - name: 上传 AnyKernel3 验证包
        uses: actions/upload-artifact@v4
        with:
          name: PD2339-Nova-v3-AnyKernel3-diagnostic
          path: ${{ runner.temp }}/PD2339-Nova-v3-AnyKernel3-diagnostic.zip
          if-no-files-found: error
